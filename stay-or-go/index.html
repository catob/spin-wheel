<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay Put</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
  <section class="center" aria-label="Wheel">
    <h1>Should I stay or go home?</h1>
    <div class="stage">
      <canvas id="wheel" width="800" height="800" role="img" aria-label="Wheel with two options: Go Home and Stay"></canvas>
      <div class="pointer" aria-hidden="true"></div>
    </div>
    <button id="spin" type="button">Let fate decide</button>
    <p id="result" class="result" role="status" aria-live="polite"></p>
    <p id="aside" class="muted" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="../wheel.js"></script>
<script src="../flash.js"></script>
<script src="stay.js"></script>
</body>
</html>
